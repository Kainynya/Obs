name: Build OrbitalSkybender Fabric Mod

on:
  push:
    paths:
      - 'OrbitalSkybenderMod/**'
      - '.github/workflows/build-obs-mod.yml'
  pull_request:
    paths:
      - 'OrbitalSkybenderMod/**'
      - '.github/workflows/build-obs-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build mod
        working-directory: OrbitalSkybenderMod
        run: gradle --no-daemon build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalSkybenderMod-1.21.11
          path: OrbitalSkybenderMod/build/libs/*.jar
